name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPCS
        run: vendor/bin/phpcs

  syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl
          coverage: none
      - name: Lint all PHP files
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: PHP behavior checks
        run: php tests/unit.php

  frontend:
    name: Frontend behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check assets/js/chatbot.js
      - run: node --check assets/js/admin.js
      - run: node --check blocks/chatbot/index.js
      - run: node --test tests/frontend.test.cjs tests/admin.test.cjs

  wordpress:
    name: WordPress integration (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: ssc_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, openssl
          tools: wp-cli
          coverage: none
      - name: Install disposable WordPress
        run: |
          mkdir -p /tmp/ssc-wordpress
          wp core download --path=/tmp/ssc-wordpress
          wp config create --path=/tmp/ssc-wordpress --dbname=ssc_test --dbuser=root --dbpass=test-only --dbhost=127.0.0.1:3306
          wp config set SSC_TEST_SITE true --raw --path=/tmp/ssc-wordpress
          wp config set DISABLE_WP_CRON true --raw --path=/tmp/ssc-wordpress
          wp core install --path=/tmp/ssc-wordpress --url=http://localhost --title=Test --admin_user=test-admin --admin_password=test-only-pass --admin_email=test@example.invalid --skip-email
          ln -s "$GITHUB_WORKSPACE" /tmp/ssc-wordpress/wp-content/plugins/smart-support-chatbot
          wp plugin activate smart-support-chatbot --path=/tmp/ssc-wordpress
      - name: Integration checks with mocked external services
        env:
          SSC_WP_TEST_ROOT: /tmp/ssc-wordpress
        run: php tests/integration.php

  package:
    name: Release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the distributable ZIP
        run: python tools/build-release.py
      - name: Verify no development files were shipped
        run: python tools/verify-release.py
      - uses: actions/upload-artifact@v5
        with:
          name: nexachat-ai-plugin
          path: dist/*.zip
          if-no-files-found: error
