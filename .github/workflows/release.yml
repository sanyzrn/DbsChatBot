name: Release

# Releases publish themselves. When CI finishes green on main, this workflow
# looks at the plugin version: if that version has not been released yet, the
# ZIP is built and verified here and the release is published. A merge that
# does not change the version publishes nothing. (tools/plan-release.py makes
# that decision; tests/plan_release_test.py covers it.)
#
# The ZIP is built and verified here rather than uploaded by hand, so what
# customers download is always exactly what the released commit produces.
#
# It can still be started by hand (Actions -> Release -> Run workflow), or by
# pushing a v* tag:
#   - for an existing tag: rebuilds from that tag and repairs its release;
#   - for a new tag: builds the branch you run it on (normally main) and
#     GitHub creates the tag together with the release.
#
# If the release was already created in the GitHub UI (which also creates the
# tag), the ZIP is attached to that release instead of failing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.1.1 (created from the selected branch if it does not exist yet)'
        required: true
        type: string
      dry_run:
        description: 'Build and verify only: publish nothing (to test the workflow itself)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One run per commit (or per tag), so two merges in a row are both released.
concurrency:
  group: release-${{ inputs.tag || github.event.workflow_run.head_sha || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide what to publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      # For a CI run, the exact commit CI tested (main may have moved on since).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Decide
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: python tools/plan-release.py

  publish:
    name: Build, verify and publish
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select the source (existing tag, or the branch for a new tag)
        run: |
          set -e
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "refs/tags/$TAG"
            echo "TAG_EXISTS=1" >> "$GITHUB_ENV"
            echo "Building existing tag $TAG ($(git rev-parse --short HEAD))"
          else
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::Tag $TAG not found"; exit 1
            fi
            echo "TAG_EXISTS=0" >> "$GITHUB_ENV"
            echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "Tag $TAG does not exist yet: building $(git rev-parse --short HEAD) (${{ github.event_name }} on ${{ github.event.workflow_run.head_branch || github.ref_name }})"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check the tag matches the plugin version
        run: |
          set -e
          tag="${TAG#v}"
          version=$(grep -oP "define\( 'SSC_CHATBOT_VERSION', '\K[^']+" vazho.php)
          echo "tag=$tag plugin=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $TAG does not match SSC_CHATBOT_VERSION $version"
            exit 1
          fi

      - name: Build the distributable ZIP
        run: python tools/build-release.py

      - name: Verify no development files were shipped
        run: python tools/verify-release.py

      - name: Extract the changelog section for this version
        run: |
          set -e
          version="${TAG#v}"
          # Written from Python directly rather than via stdout redirection so
          # the notes keep their UTF-8 (em dashes, Persian) whatever the
          # runner's stdout encoding happens to be.
          python - "$version" <<'PY'
          import io, re, sys
          version = sys.argv[1]
          readme = io.open('readme.txt', encoding='utf-8').read()
          match = re.search(
              r'^= ' + re.escape(version) + r' =\s*\n(.*?)(?=^= |\Z)',
              readme.split('== Changelog ==', 1)[-1],
              re.S | re.M,
          )
          if not match:
              sys.exit('No changelog section found for ' + version + ' in readme.txt.')
          notes = (
              match.group(1).strip()
              + '\n\n---\n\n'
              + '**Install:** download `vazho-' + version + '.zip` below and upload it via '
              + 'Plugins → Add New → Upload Plugin. The "Source code" archives are the raw '
              + 'repository and are not installable.\n'
              + 'Verify the download against the published `.sha256` file.\n'
          )
          io.open('RELEASE_NOTES.md', 'w', encoding='utf-8', newline='\n').write(notes)
          PY
          cat RELEASE_NOTES.md

      - name: Dry run finished
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run - ${TAG} was built and verified; nothing was published."

      - name: Publish the release (or complete an existing one)
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          title="Vazho ${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: attaching the ZIP and refreshing its notes."
            gh release upload "$TAG" dist/*.zip dist/*.zip.sha256 --clobber
            gh release edit "$TAG" --title "$title" --notes-file RELEASE_NOTES.md
          elif [ "$TAG_EXISTS" = "1" ]; then
            gh release create "$TAG" --verify-tag \
              --title "$title" \
              --notes-file RELEASE_NOTES.md \
              dist/*.zip dist/*.zip.sha256
          else
            # New tag: GitHub creates it on the exact commit that was built.
            gh release create "$TAG" --target "$TARGET_SHA" \
              --title "$title" \
              --notes-file RELEASE_NOTES.md \
              dist/*.zip dist/*.zip.sha256
          fi

      - name: Confirm the installable ZIP is attached
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -qx "vazho-${TAG#v}.zip" || { echo "::error::vazho-${TAG#v}.zip is not attached to $TAG"; exit 1; }
