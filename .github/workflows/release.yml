name: Release

# Pushing a v* tag publishes the release. The ZIP is built and verified here
# rather than uploaded by hand, so what customers download is always exactly
# what the tagged commit produces.
#
# If the release was already created in the GitHub UI (which also creates the
# tag), the ZIP is attached to that release instead of failing. The workflow
# can also be run by hand for an existing tag (Actions -> Release -> Run
# workflow) to repair a release that is missing its ZIP.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v1.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check the tag matches the plugin version
        run: |
          set -e
          tag="${TAG#v}"
          version=$(grep -oP "define\( 'SSC_CHATBOT_VERSION', '\K[^']+" nexachat-ai.php)
          echo "tag=$tag plugin=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $TAG does not match SSC_CHATBOT_VERSION $version"
            exit 1
          fi

      - name: Build the distributable ZIP
        run: python tools/build-release.py

      - name: Verify no development files were shipped
        run: python tools/verify-release.py

      - name: Extract the changelog section for this version
        run: |
          set -e
          version="${TAG#v}"
          # Written from Python directly rather than via stdout redirection so
          # the notes keep their UTF-8 (em dashes, Persian) whatever the
          # runner's stdout encoding happens to be.
          python - "$version" <<'PY'
          import io, re, sys
          version = sys.argv[1]
          readme = io.open('readme.txt', encoding='utf-8').read()
          match = re.search(
              r'^= ' + re.escape(version) + r' =\s*\n(.*?)(?=^= |\Z)',
              readme.split('== Changelog ==', 1)[-1],
              re.S | re.M,
          )
          if not match:
              sys.exit('No changelog section found for ' + version + ' in readme.txt.')
          notes = (
              match.group(1).strip()
              + '\n\n---\n\n'
              + '**Install:** download `nexachat-ai-' + version + '.zip` below and upload it via '
              + 'Plugins → Add New → Upload Plugin. The "Source code" archives are the raw '
              + 'repository and are not installable.\n'
              + 'Verify the download against the published `.sha256` file.\n'
          )
          io.open('RELEASE_NOTES.md', 'w', encoding='utf-8', newline='\n').write(notes)
          PY
          cat RELEASE_NOTES.md

      - name: Publish the release (or complete an existing one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          title="NexaChatAI ${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: attaching the ZIP and refreshing its notes."
            gh release upload "$TAG" dist/*.zip dist/*.zip.sha256 --clobber
            gh release edit "$TAG" --title "$title" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --verify-tag \
              --title "$title" \
              --notes-file RELEASE_NOTES.md \
              dist/*.zip dist/*.zip.sha256
          fi

      - name: Confirm the installable ZIP is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -qx "nexachat-ai-${TAG#v}.zip" || { echo "::error::nexachat-ai-${TAG#v}.zip is not attached to $TAG"; exit 1; }
